apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: minha-api-ingress
  namespace: estudos

spec:
  ingressClassName: nginx

  rules:
    - host: api.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: minha-api-service

                port:
                  number: 8000